<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقطة البيع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Cairo', sans-serif; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            max-height: calc(100vh - 220px);
            overflow-y: auto;
        }
        .product-card {
            cursor: pointer;
            border-radius: 0.5rem;
            transition: transform 0.1s;
            border: 1px solid #dee2e6;
        }
        .product-card:hover { transform: scale(1.03); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .cart-items { max-height: 35vh; overflow-y: auto; }
        .pos-container {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 1.5rem;
            height: 100vh;
            padding: 1rem;
        }
        .left-panel { display: flex; flex-direction: column; }
        .right-panel { background-color: white; border-radius: 0.5rem; padding: 1rem; display: flex; flex-direction: column; }
        #customer-search-results .list-group-item { cursor: pointer; }
        #customer-search-results .list-group-item:hover { background-color: #f0f0f0; }
        #customer-display {
            border: 1px solid #ced4da;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            background-color: #e9ecef;
        }
        .quantity-control {
            display: flex;
            align-items: center;
        }
        .quantity-control .btn {
            padding: 0.2rem 0.5rem;
            font-size: 0.8rem;
        }
        .quantity-control .form-control {
            text-align: center;
            width: 50px;
            -moz-appearance: textfield;
        }
        .quantity-control input::-webkit-outer-spin-button,
        .quantity-control input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }


        /* Styles for printable invoice */
        .invoice-thermal {
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #000;
            padding: 5px;
        }
        .invoice-thermal h4, .invoice-thermal h5 {
            text-align: center;
            margin: 5px 0;
        }
        .invoice-thermal hr {
            border-top: 1px dashed #000;
        }
        .invoice-thermal table {
            width: 100%;
            font-size: 11px;
            border-collapse: collapse;
        }
        .invoice-thermal th, .invoice-thermal td {
            padding: 2px;
        }
        .invoice-thermal .text-end { text-align: right; }
        .invoice-thermal .totals-table td:first-child { font-weight: bold; }

        @media print {
            body * {
                visibility: hidden;
            }
            .modal-footer.d-print-none button {
                display: none;
            }
            #invoice-content-wrapper, #invoice-content-wrapper * {
                visibility: visible;
            }
            #invoice-content-wrapper {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            @page {
                size: 80mm auto; /* Common thermal printer width */
                margin: 2mm;
            }
            .modal-dialog {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
            }
            .modal-content {
                border: none !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>

<div class="pos-container">
    <!-- Left Panel: Products and Search -->
    <div class="left-panel">
        <div class="card mb-3">
            <div class="card-body p-2">
                <div class="warehouse-filter mb-2">
                    <h6>المخازن</h6>
                    <div id="warehouse-filter-btns" class="btn-group flex-wrap" role="group">
                        <button type="button" class="btn btn-outline-primary active" data-warehouse-id="all">الكل</button>
                        {% for warehouse in warehouses %}
                            <button type="button" class="btn btn-outline-primary" data-warehouse-id="{{ warehouse.id }}">{{ warehouse.name }}</button>
                        {% endfor %}
                    </div>
                </div>
                <hr class="my-2">
                <div class="d-flex gap-2">
                    <input type="text" id="product-search" class="form-control" placeholder="ابحث بالاسم أو الباركود...">
                    <select id="category-filter" class="form-select" style="width: 200px;">
                        <option value="all">كل الفئات</option>
                        {% for category in categories %}
                            <option value="{{ category.name }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
        <div id="product-grid" class="product-grid p-2 bg-white rounded border"></div>
    </div>

    <!-- Right Panel: Cart and Payment -->
    <div class="right-panel shadow-sm">
        <div class="d-flex align-items-center gap-2 mb-3">
            <div class="flex-grow-1 position-relative">
                <div id="customer-display" class="d-none align-items-center justify-content-between">
                    <span class="fw-bold" id="selected-customer-name"></span>
                    <button id="clear-customer-btn" class="btn btn-sm btn-outline-danger">تغيير</button>
                </div>
                <div id="customer-search-wrapper">
                     <input type="text" id="customer-search-input" class="form-control" placeholder="ابحث عن عميل بالاسم أو رقم الهاتف...">
                     <div id="customer-search-results" class="list-group position-absolute w-100" style="z-index: 1000; max-height: 300px; overflow-y: auto;"></div>
                </div>
            </div>
            <button id="add-customer-btn" class="btn btn-outline-primary btn-sm" title="عميل جديد (F2)">
                <i class="fa fa-plus"></i>
            </button>
        </div>
        <hr>
        <div class="cart-items mb-auto">
            <table class="table">
                <tbody id="cart-table-body"></tbody>
            </table>
        </div>
        <div class="totals">
            <div class="d-flex justify-content-between">
                <span>الإجمالي الفرعي</span>
                <span id="subtotal">0.00</span>
            </div>

            <!-- Enhanced Discount Section -->
            <div class="d-flex justify-content-between align-items-center mt-2">
                <span class="fw-medium">
                    <i class="fa fa-tag me-1 text-muted"></i>الخصم
                </span>
                <div class="input-group input-group-sm" style="width: 170px;">
                    <input type="number" id="discount-value" class="form-control" value="0" min="0" placeholder="القيمة">
                    <div id="discount-type-toggle" class="btn-group" role="group">
                        <input type="radio" class="btn-check" name="discount-type" id="discount-fixed" autocomplete="off" value="fixed" checked>
                        <label class="btn btn-outline-primary" for="discount-fixed">جنيه</label>

                        <input type="radio" class="btn-check" name="discount-type" id="discount-percentage" autocomplete="off" value="percentage">
                        <label class="btn btn-outline-primary" for="discount-percentage">%</label>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-end text-danger small">
                <span id="discount-amount-display">-0.00</span>
            </div>
            <!-- End Enhanced Discount Section -->

            <hr class="my-2">
            <div class="d-flex justify-content-between fw-bold fs-5">
                <span>الإجمالي النهائي</span>
                <span id="total">0.00</span>
            </div>
        </div>
        <div class="d-grid gap-2 mt-3">
            <button id="payment-btn" class="btn btn-success btn-lg">دفع (F1)</button>
            <button id="save-draft-btn" class="btn btn-secondary">حفظ كمسودة (F4)</button>
        </div>
    </div>
</div>

<!-- Add Customer Modal -->
<div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">إضافة عميل جديد</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="add-customer-form" novalidate>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="id_name" class="form-label">الاسم</label>
                        <input type="text" name="name" class="form-control" required id="id_name">
                    </div>
                    <div class="mb-3">
                        <label for="id_phone_number" class="form-label">رقم الهاتف</label>
                        <input type="text" name="phone_number" class="form-control" required id="id_phone_number" placeholder="01012345678">
                    </div>
                    <div class="mb-3">
                        <label for="id_email" class="form-label">البريد الإلكتروني (اختياري)</label>
                        <input type="email" name="email" class="form-control" id="id_email">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                    <button type="submit" class="btn btn-primary">حفظ العميل</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">الدفع</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex justify-content-between fs-4 mb-3">
                    <span>المبلغ المطلوب:</span>
                    <span id="total-due-payment" class="fw-bold">0.00</span>
                </div>
                <div id="payment-lines"></div>
                <button id="add-payment-line-btn" class="btn btn-outline-primary mt-2"><i class="fa fa-plus"></i> إضافة طريقة دفع أخرى</button>
                <hr>
                 <div class="d-flex justify-content-between fs-4">
                    <span>المتبقي:</span>
                    <span id="remaining-amount" class="fw-bold text-danger">0.00</span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" id="confirm-payment-btn" class="btn btn-success" disabled>تأكيد الدفع</button>
            </div>
        </div>
    </div>
</div>

<!-- Invoice Modal -->
<div class="modal fade" id="invoiceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header d-print-none">
                <h5 class="modal-title">الفاتورة</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="window.location.reload()"></button>
            </div>
            <div class="modal-body" id="invoice-content-wrapper">
                <!-- Invoice content will be injected here by JavaScript -->
            </div>
            <div class="modal-footer d-print-none">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="window.location.reload()">إغلاق</button>
                <button type="button" id="send-whatsapp-btn" class="btn btn-success"><i class="fab fa-whatsapp"></i> إرسال واتساب</button>
                <button type="button" id="print-invoice-btn" class="btn btn-primary"><i class="fa fa-print"></i> طباعة</button>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    // --- STATE MANAGEMENT ---
    let products = [];
    let cart = {};
    let selectedWarehouseId = 'all';
    let customerSearchTimeout;
    let lastInvoiceData = null; // To store data for WhatsApp/Print

    const customerModal = new bootstrap.Modal(document.getElementById('customerModal'));
    const paymentModal = new bootstrap.Modal(document.getElementById('paymentModal'));
    const invoiceModal = new bootstrap.Modal(document.getElementById('invoiceModal'));

    // --- DOM ELEMENTS ---
    const productGrid = document.getElementById('product-grid');
    const cartTableBody = document.getElementById('cart-table-body');
    const subtotalEl = document.getElementById('subtotal');
    const totalEl = document.getElementById('total');
    const discountValueInput = document.getElementById('discount-value');
    const discountTypeToggle = document.getElementById('discount-type-toggle');
    const discountAmountDisplay = document.getElementById('discount-amount-display');
    const productSearchInput = document.getElementById('product-search');
    const warehouseFilterBtns = document.getElementById('warehouse-filter-btns');
    const paymentBtn = document.getElementById('payment-btn');
    const customerSearchInput = document.getElementById('customer-search-input');
    const customerSearchResults = document.getElementById('customer-search-results');
    const customerDisplay = document.getElementById('customer-display');
    const customerSearchWrapper = document.getElementById('customer-search-wrapper');
    const selectedCustomerName = document.getElementById('selected-customer-name');
    const clearCustomerBtn = document.getElementById('clear-customer-btn');
    const addCustomerForm = document.getElementById('add-customer-form');

    // --- INITIALIZATION ---
    function initializeCart() {
        cart = {
            customer_id: null,
            customer_name: null,
            items: {},
            subtotal: 0,
            discount_value: 0,
            discount_type: 'fixed',
            discount_amount: 0,
            total: 0,
        };
        discountValueInput.value = 0;
        document.getElementById('discount-fixed').checked = true;
        clearCustomer();
        updateCart();
    }

    fetchProducts();
    updatePaymentButtonState();
    initializeCart();
    loadDraft();

    // --- EVENT LISTENERS ---
    document.getElementById('add-customer-btn').addEventListener('click', () => customerModal.show());
    document.getElementById('save-draft-btn').addEventListener('click', saveDraft);
    paymentBtn.addEventListener('click', handlePayment);
    productSearchInput.addEventListener('input', renderProducts);
    document.getElementById('category-filter').addEventListener('change', renderProducts);
    discountValueInput.addEventListener('input', updateCart);
    discountTypeToggle.addEventListener('change', updateCart);
    document.getElementById('print-invoice-btn').addEventListener('click', () => window.print());
    document.getElementById('send-whatsapp-btn').addEventListener('click', sendWhatsAppInvoice);
    
    warehouseFilterBtns.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') {
            selectedWarehouseId = e.target.dataset.warehouseId;
            warehouseFilterBtns.querySelector('.active').classList.remove('active');
            e.target.classList.add('active');
            updatePaymentButtonState();
            fetchProducts();
        }
    });

    customerSearchInput.addEventListener('input', () => {
        clearTimeout(customerSearchTimeout);
        customerSearchTimeout = setTimeout(() => {
            const query = customerSearchInput.value;
            if (query.length > 1) {
                fetchCustomers(query);
            } else {
                customerSearchResults.innerHTML = '';
            }
        }, 300);
    });

    clearCustomerBtn.addEventListener('click', clearCustomer);
    addCustomerForm.addEventListener('submit', handleAddCustomer);
    document.getElementById('add-payment-line-btn').addEventListener('click', addPaymentLine);
    document.getElementById('confirm-payment-btn').addEventListener('click', submitSale);

    document.addEventListener('click', (e) => {
        if (!customerSearchWrapper.contains(e.target)) {
            customerSearchResults.innerHTML = '';
        }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 'F1') {
            e.preventDefault();
            if(!paymentBtn.disabled) handlePayment();
        }
        if (e.key === 'F2') {
            e.preventDefault();
            customerModal.show();
        }
        if (e.key === 'F4') {
            e.preventDefault();
            saveDraft();
        }
        if (e.key === 'F8') {
            e.preventDefault();
            // Assuming you have a dashboard url
            window.location.href = "/";
        }
    });
    
    // --- FUNCTIONS ---

    async function fetchProducts() {
        try {
            let url = `{% url 'sales:api_product_list' %}?warehouse_id=${selectedWarehouseId}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Server error: ${response.status}`);
            products = await response.json();
            renderProducts();
        } catch (error) {
            console.error("Failed to fetch products:", error);
            productGrid.innerHTML = '<p class="text-danger text-center p-5">فشل تحميل المنتجات.</p>';
        }
    }

    function renderProducts() {
        const searchTerm = productSearchInput.value.toLowerCase();
        const category = document.getElementById('category-filter').value;
        productGrid.innerHTML = '';
        
        const filteredProducts = products.filter(p => 
            (category === 'all' || p.category === category) &&
            (p.name.toLowerCase().includes(searchTerm) || (p.code && p.code.includes(searchTerm)))
        );

        if (filteredProducts.length === 0) {
            productGrid.innerHTML = '<p class="text-center p-5">لا توجد منتجات مطابقة.</p>';
            return;
        }

        filteredProducts.forEach(p => {
            const card = `
                <div class="card product-card" data-product-id="${p.id}">
                    <div class="card-body p-2 text-center">
                        <h6 class="card-title small">${p.name}</h6>
                        <p class="card-text small text-muted">${p.code || ''}</p>
                        <span class="badge bg-success">${p.price.toFixed(2)} جنيه</span>
                        <span class="badge bg-info">متوفر: ${p.quantity}</span>
                         <div class="quick-add-btns mt-2">
                            <button class="btn btn-outline-secondary btn-sm" onclick="event.stopPropagation(); quickAddToCart(${p.id}, 6)">+6</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="event.stopPropagation(); quickAddToCart(${p.id}, 12)">+12</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="event.stopPropagation(); quickAddToCart(${p.id}, 48)">+48</button>
                        </div>
                    </div>
                </div>`;
            productGrid.insertAdjacentHTML('beforeend', card);
        });
        
        document.querySelectorAll('.product-card').forEach(card => {
            card.addEventListener('click', () => addToCart(card.dataset.productId));
        });
    }

    window.quickAddToCart = (productId, quantity) => {
        event.stopPropagation();
        addToCart(productId, quantity);
    };

    function addToCart(productId, quantity = 1) {
        const product = products.find(p => p.id == productId);
        if (!product) return;

        if (cart.items[productId]) {
            cart.items[productId].quantity += quantity;
        } else {
            cart.items[productId] = { id: product.id, name: product.name, price: product.price, quantity: quantity };
        }
        updateCart();
    }

    function updateCart() {
        cartTableBody.innerHTML = '';
        let subtotal = 0;
        
        if (Object.keys(cart.items).length === 0) {
            cartTableBody.innerHTML = '<tr><td colspan="4" class="text-center">السلة فارغة</td></tr>';
        } else {
            for (const productId in cart.items) {
                const item = cart.items[productId];
                subtotal += item.price * item.quantity;
                const row = `
                    <tr>
                        <td>${item.name}</td>
                        <td>
                            <div class="quantity-control">
                                <button class="btn btn-outline-secondary" onclick="updateQuantity(${productId}, ${item.quantity - 1})">-</button>
                                <input type="number" class="form-control mx-1" value="${item.quantity}" onchange="updateQuantity(${productId}, this.value)">
                                <button class="btn btn-outline-secondary" onclick="updateQuantity(${productId}, ${item.quantity + 1})">+</button>
                            </div>
                        </td>
                        <td>${parseFloat(item.price).toFixed(2)}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="removeFromCart(${productId})"><i class="fa fa-trash"></i></button></td>
                    </tr>`;
                cartTableBody.insertAdjacentHTML('beforeend', row);
            }
        }
        
        cart.subtotal = subtotal;
        
        // Discount Calculation
        cart.discount_value = parseFloat(discountValueInput.value) || 0;
        cart.discount_type = document.querySelector('input[name="discount-type"]:checked').value;

        if (cart.discount_type === 'percentage') {
            cart.discount_amount = (cart.subtotal * cart.discount_value) / 100;
        } else {
            cart.discount_amount = cart.discount_value;
        }

        if (cart.discount_amount > cart.subtotal) {
            cart.discount_amount = cart.subtotal;
        }

        cart.total = cart.subtotal - cart.discount_amount;

        subtotalEl.textContent = cart.subtotal.toFixed(2);
        discountAmountDisplay.textContent = `-${cart.discount_amount.toFixed(2)}`;
        totalEl.textContent = cart.total.toFixed(2);
    }

    window.updateQuantity = (productId, newQuantity) => {
        const qty = parseInt(newQuantity, 10);
        if (cart.items[productId]) {
            if (qty > 0) cart.items[productId].quantity = qty;
            else delete cart.items[productId];
            updateCart();
        }
    };

    window.removeFromCart = (productId) => {
        if (cart.items[productId]) {
            delete cart.items[productId];
            updateCart();
        }
    };

    function updatePaymentButtonState() {
        paymentBtn.disabled = selectedWarehouseId === 'all';
        paymentBtn.title = selectedWarehouseId === 'all' ? 'الرجاء اختيار مخزن محدد لإتمام البيع' : '';
    }

    function saveDraft() {
        if (Object.keys(cart.items).length === 0) return alert("السلة فارغة.");
        localStorage.setItem('posDraft', JSON.stringify(cart));
        alert('تم حفظ الطلب كمسودة بنجاح!');
    }

    function loadDraft() {
        const draft = localStorage.getItem('posDraft');
        if (draft) {
            if (confirm('يوجد طلب معلق، هل تريد استعادته؟')) {
                cart = JSON.parse(draft);
                if (cart.customer_id) {
                    selectCustomer(cart.customer_id, cart.customer_name);
                }
                discountValueInput.value = cart.discount_value || 0;
                if (cart.discount_type === 'percentage') {
                    document.getElementById('discount-percentage').checked = true;
                } else {
                    document.getElementById('discount-fixed').checked = true;
                }
                updateCart();
            } else {
                localStorage.removeItem('posDraft');
            }
        }
    }

    async function fetchCustomers(query) {
        try {
            const response = await fetch(`{% url 'crm:api_customer_search' %}?q=${encodeURIComponent(query)}`);
            const results = await response.json();
            renderCustomerResults(results);
        } catch (error) { console.error('Failed to fetch customers:', error); }
    }
    
    function renderCustomerResults(results) {
        customerSearchResults.innerHTML = results.length === 0 ? '<span class="list-group-item disabled">لا يوجد عملاء مطابقين</span>' : '';
        results.forEach(customer => {
            const item = document.createElement('a');
            item.href = '#';
            item.className = 'list-group-item list-group-item-action';
            item.textContent = customer.text;
            item.addEventListener('click', (e) => {
                e.preventDefault();
                selectCustomer(customer.id, customer.text);
            });
            customerSearchResults.appendChild(item);
        });
    }

    function selectCustomer(id, name) {
        cart.customer_id = id;
        cart.customer_name = name;
        selectedCustomerName.textContent = name;
        customerDisplay.classList.remove('d-none');
        customerDisplay.classList.add('d-flex');
        customerSearchWrapper.style.display = 'none';
        customerSearchResults.innerHTML = '';
    }

    function clearCustomer() {
        cart.customer_id = null;
        cart.customer_name = null;
        customerDisplay.classList.add('d-none');
        customerSearchWrapper.style.display = 'block';
        customerSearchInput.value = '';
    }

    function formatPhoneNumber(phone) {
        let cleaned = ('' + phone).replace(/\D/g, '');
        if (cleaned.startsWith('01') && cleaned.length === 11) {
            return '+20' + cleaned.substring(1);
        }
        if (cleaned.startsWith('201') && cleaned.length === 12) {
            return '+' + cleaned;
        }
        return phone; // Return original if not a standard Egyptian mobile number
    }

    async function handleAddCustomer(e) {
        e.preventDefault();
        const formData = new FormData(addCustomerForm);
        const data = Object.fromEntries(formData.entries());
        
        // Format the phone number before sending
        data.phone_number = formatPhoneNumber(data.phone_number);

        try {
            // This requires a crm app with api_customer_create url name
            const response = await fetch("{% url 'crm:api_customer_create' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify(data),
            });
            const result = await response.json();
            if (!response.ok) throw result;
            alert(result.message || "تم إنشاء العميل بنجاح!");
            selectCustomer(result.id, result.name);
            customerModal.hide();
            addCustomerForm.reset();
        } catch (error) {
            let errorMsg = "فشل إنشاء العميل:\n" + (error.detail || JSON.stringify(error));
            alert(errorMsg);
        }
    }

    function handlePayment() {
        if (!cart.customer_id) return alert("الرجاء اختيار العميل أولاً.");
        if (Object.keys(cart.items).length === 0) return alert("السلة فارغة.");
        
        document.getElementById('total-due-payment').textContent = cart.total.toFixed(2);
        document.getElementById('payment-lines').innerHTML = '';
        addPaymentLine();
        updateRemainingAmount();
        paymentModal.show();
    }
    
    function addPaymentLine() {
        const id = Date.now();
        const lineHtml = `<div class="row g-2 mb-2 align-items-center payment-line" data-id="${id}"><div class="col-md-4"><select class="form-select payment-method"><option value="CASH">نقدي</option><option value="VISA">فيزا</option><option value="SMART_WALLET">محفظة ذكية</option><option value="INSTAPAY">إنستا باي</option><option value="BANK_TRANSFER">تحويل بنكي</option><option value="CHEQUE">شيك</option></select></div><div class="col-md-4"><input type="number" class="form-control payment-amount" placeholder="المبلغ"></div><div class="col-md-3"><input type="text" class="form-control payment-details" placeholder="تفاصيل" style="display: none;"></div><div class="col-md-1"><button class="btn btn-danger btn-sm" onclick="removePaymentLine(${id})"><i class="fa fa-times"></i></button></div></div>`;
        document.getElementById('payment-lines').insertAdjacentHTML('beforeend', lineHtml);
        
        const newLine = document.querySelector(`.payment-line[data-id="${id}"]`);
        newLine.querySelector('.payment-method').addEventListener('change', togglePaymentDetails);
        newLine.querySelector('.payment-amount').addEventListener('input', updateRemainingAmount);
    }

    window.removePaymentLine = (id) => {
        document.querySelector(`.payment-line[data-id="${id}"]`).remove();
        updateRemainingAmount();
    };

    function togglePaymentDetails(event) {
        const detailsInput = event.target.closest('.payment-line').querySelector('.payment-details');
        detailsInput.style.display = ['CASH'].includes(event.target.value) ? 'none' : 'block';
    }

    function updateRemainingAmount() {
        let totalPaid = 0;
        document.querySelectorAll('.payment-amount').forEach(input => { totalPaid += parseFloat(input.value) || 0; });
        const remaining = cart.total - totalPaid;
        const remainingEl = document.getElementById('remaining-amount');
        remainingEl.textContent = remaining.toFixed(2);
        remainingEl.classList.toggle('text-danger', remaining.toFixed(2) !== '0.00');
        remainingEl.classList.toggle('text-success', remaining.toFixed(2) === '0.00');
        document.getElementById('confirm-payment-btn').disabled = remaining.toFixed(2) !== '0.00' || totalPaid === 0;
    }
    
    async function submitSale() {
        const payments = Array.from(document.querySelectorAll('.payment-line')).map(line => ({
            method: line.querySelector('.payment-method').value,
            amount: parseFloat(line.querySelector('.payment-amount').value),
            transaction_id: line.querySelector('.payment-details').value,
        }));
        
        const saleData = {
            customer_id: cart.customer_id,
            warehouse_id: selectedWarehouseId,
            items: Object.values(cart.items),
            payments: payments,
            status: 'PAID',
            discount_amount: cart.discount_amount,
        };

        try {
            const response = await fetch("{% url 'sales:api_invoice_create' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify(saleData),
            });
            if (!response.ok) throw await response.json();
            const result = await response.json();
            
            paymentModal.hide();
            showInvoiceModal(result);
            localStorage.removeItem('posDraft');
            initializeCart();

        } catch (error) {
            console.error('Sale submission error:', error);
            alert(`حدث خطأ: ${error.error || 'فشل في إرسال الفاتورة'}`);
        }
    }

    function showInvoiceModal(invoiceData) {
        lastInvoiceData = invoiceData;
        const wrapper = document.getElementById('invoice-content-wrapper');

        let itemsHtml = '';
        invoiceData.items.forEach(item => {
            itemsHtml += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.quantity}</td>
                    <td>${item.unit_price.toFixed(2)}</td>
                    <td class="text-end">${item.total.toFixed(2)}</td>
                </tr>
            `;
        });

        const invoiceHtml = `
            <div class="invoice-thermal">
                <h4>Your Store Name</h4>
                <h5>فاتورة ضريبية مبسطة</h5>
                <p>رقم الفاتورة: ${invoiceData.invoice_number}</p>
                <p>التاريخ: ${invoiceData.issue_date}</p>
                <p>العميل: ${invoiceData.customer.name}</p>
                <hr>
                <table>
                    <thead>
                        <tr>
                            <th>الصنف</th>
                            <th>الكمية</th>
                            <th>السعر</th>
                            <th class="text-end">الإجمالي</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${itemsHtml}
                    </tbody>
                </table>
                <hr>
                <table class="totals-table">
                    <tbody>
                        <tr>
                            <td>الإجمالي الفرعي:</td>
                            <td class="text-end">${invoiceData.subtotal.toFixed(2)}</td>
                        </tr>
                        <tr>
                            <td>الخصم:</td>
                            <td class="text-end">${invoiceData.discount_amount.toFixed(2)}</td>
                        </tr>
                        <tr>
                            <td><strong>الإجمالي:</strong></td>
                            <td class="text-end"><strong>${invoiceData.total.toFixed(2)}</strong></td>
                        </tr>
                    </tbody>
                </table>
                <hr>
                <h5 style="margin-top: 10px;">شكراً لزيارتكم!</h5>
            </div>
        `;

        wrapper.innerHTML = invoiceHtml;
        invoiceModal.show();
    }

    function sendWhatsAppInvoice() {
        if (!lastInvoiceData) return;

        let phone = lastInvoiceData.customer.phone_number.replace(/[^0-9]/g, '');

        if (phone.startsWith('01') && phone.length === 11) {
            phone = '20' + phone.substring(1);
        } else if (phone.startsWith('1') && phone.length === 10) {
             phone = '201' + phone;
        }
        
        if (!phone.startsWith('20')) {
           alert('رقم الهاتف غير صحيح لإرسال واتساب.');
           return;
        }

        let message = `*فاتورة من متجرك*\n\n`;
        message += `مرحباً ${lastInvoiceData.customer.name},\n`;
        message += `شكراً لشرائكم.\n\n`;
        message += `*رقم الفاتورة:* ${lastInvoiceData.invoice_number}\n`;
        message += `*التاريخ:* ${lastInvoiceData.issue_date}\n\n`;
        message += `*المنتجات:*\n`;
        lastInvoiceData.items.forEach(item => {
            message += `- ${item.name} (الكمية: ${item.quantity}) = ${item.total.toFixed(2)} جنيه\n`;
        });
        message += `\n`;
        message += `*الإجمالي الفرعي:* ${lastInvoiceData.subtotal.toFixed(2)} جنيه\n`;
        message += `*الخصم:* ${lastInvoiceData.discount_amount.toFixed(2)} جنيه\n`;
        message += `*الإجمالي النهائي:* *${lastInvoiceData.total.toFixed(2)} جنيه*\n\n`;
        message += `شكراً لثقتكم بنا!`;

        const encodedMessage = encodeURIComponent(message);
        const whatsappUrl = `https://wa.me/${phone}?text=${encodedMessage}`;
        
        window.open(whatsappUrl, '_blank');
    }
});
</script>
