{% extends 'base.html' %}

{% block title %}تأكيد الحذف{% endblock %}

{% block content %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-danger">تأكيد الحذف</h6>
    </div>
    <div class="card-body">
        <p>هل أنت متأكد أنك تريد حذف الحساب "<strong>{{ object.name }}</strong>"؟</p>
        <p class="text-danger">
            <i class="fas fa-exclamation-triangle"></i>
            لا يمكن التراجع عن هذا الإجراء.
        </p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">نعم، احذف</button>
            <a href="{% url 'finance:account_list' %}" class="btn btn-secondary">إلغاء</a>
        </form>
    </div>
</div>
{% endblock %}
