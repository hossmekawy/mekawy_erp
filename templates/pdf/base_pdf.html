<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block pdf_title %}تقرير{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            font-size: 10pt;
            direction: rtl;
            text-align: right;
            line-height: 1.6;
            color: #333;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            color: #0056b3;
        }
        
        .header .meta-info {
            font-size: 9pt;
            color: #777;
        }

        .content {
            width: 100%;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: right;
        }

        thead tr {
            background-color: #f2f2f2;
            color: #333;
            font-weight: bold;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        .footer {
            position: fixed;
            bottom: -20px;
            left: 0;
            right: 0;
            height: 50px;
            font-size: 8pt;
            text-align: center;
            color: #777;
            border-top: 1px solid #eee;
            padding-top: 5px;
        }
        
        .page-number:before {
            content: "صفحة " counter(page);
        }
    </style>
</head>
<body>
    <div class="header">
        {% block pdf_header %}
        <h1>تقرير النظام</h1>
        {% endblock %}
    </div>

    <div class="content">
        {% block pdf_content %}
        <p>لا يوجد محتوى.</p>
        {% endblock %}
    </div>

    
</body>
</html>
