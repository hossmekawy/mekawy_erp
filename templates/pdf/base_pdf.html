<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block pdf_title %}تقرير{% endblock %}</title>
    <style>
        @page {
            size: A5;
            margin: 1.5cm;

            @top-center {
                content: "{% block pdf_header_title %}Mekawy Group{% endblock %}";
                font-family: 'Tajawal', sans-serif;
                font-size: 12pt;
                color: #666;
            }

            @bottom-right {
                content: "صفحة " counter(page) " من " counter(pages);
                font-family: 'Tajawal', sans-serif;
                font-size: 11pt;
                color: #666;
            }
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            font-size: 16pt;
            direction: rtl;
            text-align: right;
            line-height: 1.7;
            color: #333;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #004a99;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        
        .header h1 {
            font-size: 26pt;
            color: #004a99;
            margin: 0;
        }
        
        .header .meta-info {
            font-size: 15pt;
            color: #777;
        }

        .content {
            width: 100%;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 18px;
            font-size: 14pt; 
            page-break-inside: auto;
        }

        thead tr {
            page-break-inside: avoid;
        }

        tbody tr {
            page-break-inside: avoid;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: right;
        }

        thead tr {
            background-color: #f2f2f2;
            color: #333;
            font-weight: 700;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="header">
        {% block pdf_header %}
            <h1>{% block document_main_title %}تقرير النظام{% endblock %}</h1>
            <div class="meta-info">{% now "j F Y, g:i A" %}</div>
        {% endblock %}
    </div>

    <div class="content">
        {% block pdf_content %}{% endblock %}
    </div>
</body>
</html>
