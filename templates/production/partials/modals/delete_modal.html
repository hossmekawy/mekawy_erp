<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="mt-3 text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
                <i class="fas fa-trash text-red-600 text-xl"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900 mt-4">
                تأكيد الحذف
            </h3>
            <div class="mt-2 px-7 py-3">
                <p class="text-sm text-gray-500" id="deleteMessage">
                    هل أنت متأكد من أنك تريد حذف هذا العنصر؟
                </p>
                <p class="text-xs text-red-500 mt-2">
                    لا يمكن التراجع عن هذا الإجراء
                </p>
            </div>
            <div class="flex items-center justify-center space-x-2 space-x-reverse px-4 py-3">
                <button id="deleteBtn" type="button" 
                        class="px-4 py-2 bg-red-600 text-white text-base font-medium rounded-md shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500">
                    <i class="fas fa-trash mr-1"></i>
                    حذف
                </button>
                <button id="cancelDeleteBtn" type="button" 
                        class="px-4 py-2 bg-gray-300 text-gray-800 text-base font-medium rounded-md shadow-sm hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500">
                    إلغاء
                </button>
            </div>
        </div>
    </div>
</div>
