<!-- Process Action Modal -->
<div id="processModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-10 mx-auto p-5 border w-full max-w-md shadow-lg rounded-md bg-white">
        <div class="mt-3">
            <div class="flex items-center mb-4">
                <div class="flex-shrink-0">
                    <div class="mx-auto flex items-center justify-center h-10 w-10 rounded-full bg-blue-100">
                        <i id="processIcon" class="fas fa-cogs text-blue-600"></i>
                    </div>
                </div>
                <div class="mr-3">
                    <h3 class="text-lg font-medium text-gray-900" id="processTitle">
                        تنفيذ العملية
                    </h3>
                </div>
            </div>
            
            <div class="mb-4">
                <div id="processContent" class="text-sm text-gray-600">
                    <!-- Dynamic content will be loaded here -->
                </div>
            </div>

            <!-- Process Form -->
            <form id="processForm" class="space-y-4">
                <div id="processFields">
                    <!-- Dynamic form fields will be loaded here -->
                </div>
                
                <div class="flex items-center justify-end space-x-2 space-x-reverse pt-4 border-t border-gray-200">
                    <button type="submit" 
                            class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <span id="processSubmitText">تنفيذ</span>
                        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2 hidden" id="processLoading"></div>
                    </button>
                    <button type="button" id="cancelProcessBtn"
                            class="px-4 py-2 bg-gray-300 text-gray-800 text-sm font-medium rounded-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
