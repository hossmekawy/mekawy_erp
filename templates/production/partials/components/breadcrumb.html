<!-- Breadcrumb Component -->
<nav class="flex mb-4" aria-label="Breadcrumb">
    <ol class="inline-flex items-center space-x-1 md:space-x-3 space-x-reverse">
        <li class="inline-flex items-center">
            <a href="{% url 'production:dashboard' %}" class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-blue-600">
                <i class="fas fa-home mr-2"></i>
                الرئيسية
            </a>
        </li>
        {% for crumb in breadcrumbs %}
        <li>
            <div class="flex items-center">
                <i class="fas fa-chevron-left text-gray-400 mx-1"></i>
                {% if crumb.url %}
                <a href="{{ crumb.url }}" class="mr-1 text-sm font-medium text-gray-700 hover:text-blue-600 md:mr-2">
                    {{ crumb.title }}
                </a>
                {% else %}
                <span class="mr-1 text-sm font-medium text-gray-500 md:mr-2">
                    {{ crumb.title }}
                </span>
                {% endif %}
            </div>
        </li>
        {% endfor %}
    </ol>
</nav>
