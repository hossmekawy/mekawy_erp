{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}تغيير كلمة المرور{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">تغيير كلمة المرور</h6>
                </div>
                <div class="card-body">
                    <p class="mb-4">
                        الرجاء إدخال كلمة المرور القديمة، ثم إدخال كلمة المرور الجديدة مرتين للتأكيد.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <hr>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-key"></i> تغيير كلمة المرور
                        </button>
                        <a href="{% url 'users:profile_edit' %}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> إلغاء
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
