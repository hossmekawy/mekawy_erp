<footer class="sticky-footer bg-white">
    <div class="container my-auto">
        <div class="copyright text-center my-auto">
            <div class="row">
                <div class="col-md-6 text-md-start text-center">
                    <span class="text-muted">
                        &copy; {{ current_year|default:"2023" }} 
                        <strong>Mekawy ERP</strong> - جميع الحقوق محفوظة
                    </span>
                </div>
                <div class="col-md-6 text-md-end text-center">
                    <span class="text-muted">
                        الإصدار 1.0.0 | 
                        <a href="#" class="text-decoration-none">الدعم الفني</a> | 
                        <a href="#" class="text-decoration-none">سياسة الخصوصية</a>
                    </span>
                </div>
            </div>
            
            <!-- System Status -->
            <div class="row mt-2">
                <div class="col-12 text-center">
                    <small class="text-muted">
                        <i class="fas fa-circle text-success"></i> النظام يعمل بشكل طبيعي
                        <span class="mx-2">|</span>
                        <i class="fas fa-users"></i> المستخدمين المتصلين: <span class="badge bg-primary">{{ online_users_count|default:"0" }}</span>
                        <span class="mx-2">|</span>
                        <i class="fas fa-clock"></i> آخر تحديث: <span id="lastUpdate">{{ last_update|default:"الآن" }}</span>
                    </small>
                </div>
            </div>
        </div>
    </div>
</footer>

<style>
.sticky-footer {
    position: sticky;
    bottom: 0;
    width: 100%;
    padding: 1rem 0;
    border-top: 1px solid #e3e6f0;
    margin-top: auto;
}

.copyright {
    font-size: 0.8rem;
}

.copyright a {
    color: var(--primary-color);
}

.copyright a:hover {
    color: var(--primary-color);
    text-decoration: underline !important;
}
</style>

<script>
// Update last update time
function updateLastUpdateTime() {
    const now = new Date();
    const timeString = now.toLocaleTimeString('ar-SA', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });
    document.getElementById('lastUpdate').textContent = timeString;
}

// Update every minute
setInterval(updateLastUpdateTime, 60000);
</script>
