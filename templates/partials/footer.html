{% load static %}

<footer class="footer bg-white">
    <div class="container my-auto">
        <div class="copyright text-center my-auto">
            <div class="row">
                <div class="col-md-6 text-md-start text-center">
                    <span class="text-muted">
                        &copy; {% now "Y" %} 
                        <strong>Mekawy ERP</strong> - جميع الحقوق محفوظة
                    </span>
                </div>
                <div class="col-md-6 text-md-end text-center">
                    <span class="text-muted">
                        الإصدار {{ app_version|default:"1.0.0" }} | 
                        
                    </span>
                </div>
            </div>
            
            <!-- System Status -->
            <div class="row mt-2">
                <div class="col-10 text-center">
                    <small class="text-muted">
                        <i class="fas fa-users"></i> المستخدمين المتصلين: <span class="badge bg-primary">{{ online_users_count|default:"0" }}</span>
                        <span class="mx-2">|</span>
                        <i class="fas fa-clock"></i> آخر تحديث: <span id="lastUpdate">{% now "H:i:s" %}</span>
                    </small>
                </div>
            </div>
        </div>
    </div>
</footer>

<style>
.footer {
    position: sticky;
    bottom: 0;
    width: 100%;
    padding: 1rem 0;
    border-top: 1px solid #e3e6f0;
    margin-top: auto;
}

.copyright {
    font-size: 0.8rem;
}

.copyright a {
    color: #858796;
}

.copyright a:hover {
    color: #5a5c69;
    text-decoration: underline !important;
}
</style>

<script>
// Update last update time
function updateLastUpdateTime() {
    const now = new Date();
    const timeString = now.toLocaleTimeString('ar-SA', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });
    const lastUpdateEl = document.getElementById('lastUpdate');
    if (lastUpdateEl) {
        lastUpdateEl.textContent = timeString;
    }
}

// Update every minute
setInterval(updateLastUpdateTime, 60000);
</script>
